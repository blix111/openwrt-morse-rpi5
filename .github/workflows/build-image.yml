name: Build OpenWrt Image

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (if empty, release upload is skipped and only artifact is uploaded)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex g++ gawk gcc-multilib g++-multilib git gettext \
            libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev swig file wget \
            libnl-3-dev libnl-genl-3-dev pkg-config

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch morse_driver compiler flags to ignore warnings-as-errors
        run: |
          if [ -f feeds/morse/essentials/morse_driver/Makefile ]; then
            sed -i 's/NOSTDINC_FLAGS = \\/NOSTDINC_FLAGS = -Wno-error=cpp -Wno-error \\/g' feeds/morse/essentials/morse_driver/Makefile
            echo "Successfully patched morse_driver Makefile"
          else
            echo "Error: morse_driver Makefile not found!"
            exit 1
          fi

      - name: Configure board config
        run: |
          cp boards/ekh-bcm2712/target_diffconfig .config
          make defconfig

      - name: Download package sources
        run: |
          make -j$(nproc) download

      - name: Compile OpenWrt firmware
        run: |
          make -j$(nproc) V=s

      - name: Organize output files
        run: |
          mkdir -p publish
          find bin/targets/bcm27xx/bcm2712/ -type f -name "*factory.img.gz" -exec cp {} publish/ \;

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-morse-rpi5-factory-image
          path: publish/*

      - name: Upload firmware to GitHub Release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: publish/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
